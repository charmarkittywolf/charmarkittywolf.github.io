<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- Mobile Formatting -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- Title -->
        <title>Journal</title>
        <!-- Icon -->
        <link rel="icon" href="../../assets/Icon.ico">
        <!-- Font Awesome -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer">
        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Jura:wght@300..700&family=Kalam&family=Work+Sans:ital,wght@0,100..900;1,100..900&family=The+Girl+Next+Door&family=Architects+Daughter&family=Dancing+Script:wght@400..700&family=Indie+Flower&family=Orbitron:wght@400..900&family=Philosopher:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
        <!-- JQUERY -->
        <script src="https://code.jquery.com/jquery-3.5.1.min.js" integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script>
        <!-- Scripts -->
        <script src="../../scripts/music.js"></script>
        <script src="database/rooms.js"></script>
        <script src="scripts/rooms.js"></script>
        <!-- Styles -->
        <link rel="stylesheet" href="../../styles/main.css">
        <link rel="stylesheet" href="../../styles/tasks.css">
        <link rel="stylesheet" href="../../styles/journal.css">
        <link rel="stylesheet" href="../../styles/blue-prince.css">
    </head>
    <body>
        <section id="rooms-page">
            <section id="directory">
                <h3>Mount Holly</h3>
                <h1>Directory</h1>
                <script>
                    let roomTypes = Object.keys(rooms);
                    for(let x=0; x<roomTypes.length; x++){
                        if(roomTypes[x]=="numbered"){
                            $("#directory").append(`<p>Rooms 001-046</p>`)
                        }else{
                            $("#directory").append(`<p>${roomTypes[x]}</p>`)
                        }
                    }
                </script>
            </section>
            <section id="room-box">
                <section id="room-box-top">
                    <script>
                        $("#room-box-top").prepend(`<img src='database/rooms/${currentRoom.name}.webp'>`)
                    </script>
                    <section id="room-text">
                        <script>
                            $("#room-text").append(`<p id='room-name'>${currentRoom.name}<p>`)
                            $("#room-text").append(`<p id='room-description'>${currentRoom.description}<p>`)
                        </script>
                    </section>
                </section>
                <section id="room-box-bottom">
                    <script>
                        for(let x=0; x<currentRoom.notes.length; x++){
                            $("#room-box-bottom").append(`<p class='room-note'>${currentRoom.notes[x]}</p>`)
                        }
                    </script>
                </section>
            </section>
        </section>
    </body>
</html>
