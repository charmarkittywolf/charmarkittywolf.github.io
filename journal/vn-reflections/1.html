        <section id="entry">
            <h1 id="entry-title">A Gift of Some Sort</h1>
            <h3 class="entry-date">September 13th, 2026</h3>
            <figure class="picture-box vn-picture-box">
                <figure class="vn-picture">
                    <img src="../../images/Bokuten-Kayo.png" />
                    <figcaption class="vn-picture-caption">
                        <p>It was no use...</p>
                        <p>In that moment, my legs relaxed.</p>
                        <div class="flashback">
                            <p class="vn-name">Shunsuke</p>
                            <p>"Hey, Ukutsu, you give up in the middle sometimes don't you? You've been getting subtly slower right before you reach the finish line."</p>
                            <p class="vn-name">Kayo</p>
                            <p>"That's not true. I've never gone easy on anyone in a race; not even once."</p>
                            <p class="vn-name">Shunsuke</p>
                            <p>"And I say you have. It's not a matter of going easy or not. Your feelings are the problem."</p>
                            <p class="vn-name">Shunsuke</p>
                            <p>"Don't look to your side. Don't think about anyone in front of you. Just stare your goal down and rush through it with all you've got.</p>
                            <p class="vn-name">Shunsuke</p>
                            <p>"You're at your coolest when you look straight ahead and enjoy running."</p>
                            <p class="vn-name">Kayo</p>
                            <p>"...I see. You're right!"</p>
                            <p>My withered legs regained their vitality. Shunsuke's words always gave me strength.</p>
                        </div>
                        <p class="vn-name">Kayo</p>
                        <p>"Shunsuke...!"</p>
                        <p>With this newfound power, I kicked off the asphalt and chased after the far-off trolley.</p>
                        <p>However, no matter how desperately I chased after it, it was disappearing further into the distance little by little. Even so, all I could do was run.</p>
                        <p>All I could do was run through the here and now.</p>
                        <p>I didn't think about what lay ahead of me, and focused only on running.</p>
                        <p class="vn-name">Kayo</p>
                        <p>"Haa, haa, haa..."</p>
                        <p>My heart felt like it would explode. My legs were like mere rods and had long since gone numb. It was a miracle I could even run at all.</p>
                        <p class="vn-name">Kayo</p>
                        <p>"Shunsuke...!"</p>
                        <p>No matter how desperately I chased, it got further and further away.</p>
                        <p>If I were simply confessing my feelings, then maybe I didn't have to do it right now. I could call or email him later. Even a letter would work...</p>
                        <p>...These sorts of escapes popped into my head.</p>
                        <p>But... No! I had to tell him now! Before he disappeared from this town and from my life!</p>
                        <p>I didn't want to give up on anything again. Why had I considered giving up on him for even a second?</p>
                        <p>What did it matter who Shunsuke loved? Why did I think something that little meant I should stop liking him?</p>
                        <p>My feelings weren't so weak that I could will myself to stop caring. There was no way I could give up.</p>
                        <p>After all, it wasn't like I fell in love with him just for the heck of it.</p>
                        <p>The first time we were in the same class together back in third grade, I didn't think anything of him. He was just some guy who got carried away easily.</p>
                        <p>I don't know what started it, but before I knew it, I'd fallen for him. Once I realised how I felt, those feelings became more intense by the day.</p>
                        <p>So I hadn't fallen in love with him for some specific reason, it wasn't predestined, like out of some drama, and it hadn't happened out of the blue.</p>
                        <p>There was nothing romantic about it. That's just how reality goes.</p>
                        <p>But this love I never wished for, so far from these ideals, had fallen into my lap. Regardless of my will, it had become completely irreplacable to me.</p>
                        <p>These feelings were surely a gift of some sort.</p>
                        <p>All the more reason I couldn't do as I pleased with them. I couldn't contain these feelings of love for Shunsuke.</p>
                        <p class="vn-name">Kayo</p>
                        <p>"Shunsuke... Don't go...!"</p>
                        <p>I couldn't stop myself from feeling that way. I bit my lip and turned those welling feelings into strength.</p>
                        <p class="vn-name">Kayo</p>
                        <p>"I love you... I love you...!"</p>
                    </figcaption>
                </figure>
            </figure>
